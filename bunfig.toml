[test]
# O threshold do Bun é POR ARQUIVO, não global. A média global (91%) esconderia um arquivo
# esquecido; o piso por arquivo é que pega o arquivo novo sem teste.
coverageThreshold = { lines = 0.8, functions = 0.8 }
coveragePathIgnorePatterns = [
  # Binários e gerados.
  "**/node_modules/**",
  "**/.wxt/**",
  "**/.output/**",
  # Infraestrutura de teste. `canvas-falso.ts` mora em test/ mas não é `*.test.ts`, então o Bun
  # o contava como código do produto — e um arquivo que existe só para testar não tem cobertura a dever.
  "**/test/**",
  # OAuth do Google Drive: o caminho de troca do token é `chrome.identity.launchWebAuthFlow` +
  # `chrome.storage.local` + o keyring do navegador (PKCE em launchWebAuthFlow, refresh token
  # guardado pelo Chrome e nunca tocado por código). Só roda dentro de um perfil real do Chrome.
  # O que dá para testar por unidade — escopo de cada conector, formatação de tamanho, o
  # codeChallenge do PKCE e a lista de anexos que entra no pedido — está em conectores.test.ts.
  "packages/extension/utils/conectores.ts",
  # Pontos de entrada que dependem de API de navegador ou de processo real: o service worker, o
  # painel, o content script e o `main` da ponte. São exercitados de ponta a ponta pelo smoke do
  # CI (que sobe a ponte real e fala com ela por Native Messaging), não por teste de unidade.
  "packages/extension/entrypoints/**",
  "packages/bridge/src/main.ts",
  # `rodar()` e `executar()` nesses arquivos disparam `agy`/`codex`/`claude` de verdade. O que dá
  # para testar por unidade — a montagem do comando, as flags de permissão, a leitura da resposta
  # — está em ias.test.ts e é o que segura a garantia de segurança. O resto exige as CLIs
  # instaladas e logadas, e é o smoke que cobre.
  "packages/bridge/src/ias.ts",
  # Registra e remove o host de Native Messaging: escreve em registro do Windows e em pastas de
  # navegador. Só faz sentido no CI, que roda o instalador e o desinstalador de verdade.
  "packages/bridge/src/instalar.ts",
  # Login/logout das CLIs: precisa da CLI instalada, do keyring do sistema e, no agy, de um pty.
  "packages/bridge/src/assinaturas.ts",
]

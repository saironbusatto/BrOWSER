<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:15px system-ui;margin:24px;max-width:900px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}button{padding:6px 12px;cursor:pointer}label{display:block;margin:10px 0}input,select{padding:5px;min-width:260px}nav a{margin-right:12px}.cartao{display:inline-block;border:2px solid #999;border-radius:8px;padding:16px 24px;margin:8px;cursor:pointer}.cartao.sel{border-color:#0a0;background:#efe}.menu{border:1px solid #999;padding:4px;display:inline-block}.menu div{padding:6px 14px;cursor:pointer}.fundo{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}.caixa{background:#fff;padding:24px;border-radius:8px}</style><title>Cadastro de fornecedor</title></head><body>
<h1>Cadastro de fornecedor</h1>
<form id="f" onsubmit="event.preventDefault(); window.estado.enviado = true;">
<label>Razão social <input name="razao" required></label>
<label>Nome fantasia <input name="fantasia"></label>
<label>CNPJ <input name="cnpj" required></label>
<label>Inscrição estadual <input name="ie"></label>
<label>E-mail de cobrança <input name="email" type="email"></label>
<label>Telefone <input name="telefone"></label>
<label>CEP <input name="cep"></label>
<label>Cidade <input name="cidade"></label>
<label>Estado <select name="uf"><option value="">Selecione</option><option value="SP">São Paulo</option><option value="RJ">Rio de Janeiro</option><option value="MG">Minas Gerais</option><option value="PR">Paraná</option><option value="RS">Rio Grande do Sul</option></select></label>
<label>Início do contrato <input name="inicio" type="date"></label>
<fieldset><legend>Regime tributário</legend>
<label><input type="radio" name="regime" value="simples"> Simples Nacional</label>
<label><input type="radio" name="regime" value="presumido"> Lucro Presumido</label>
<label><input type="radio" name="regime" value="real"> Lucro Real</label></fieldset>
<label><input type="checkbox" name="retem"> Retém ISS na fonte</label>
<label>Observações <input name="obs"></label>
<button type="button" id="rascunho" onclick="window.estado.rascunho = true">Salvar rascunho</button>
<button type="submit">Enviar cadastro</button>
</form>
<script>window.estado = { enviado: false, rascunho: false };
window.valores = () => Object.fromEntries([...new FormData(document.getElementById('f'))].concat([['retem', String(document.querySelector('[name=retem]').checked)]]));</script>
</body></html>

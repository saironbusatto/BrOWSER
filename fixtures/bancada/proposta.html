<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:15px system-ui;margin:24px;max-width:900px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}button{padding:6px 12px;cursor:pointer}label{display:block;margin:10px 0}input,select{padding:5px;min-width:260px}nav a{margin-right:12px}.cartao{display:inline-block;border:2px solid #999;border-radius:8px;padding:16px 24px;margin:8px;cursor:pointer}.cartao.sel{border-color:#0a0;background:#efe}.menu{border:1px solid #999;padding:4px;display:inline-block}.menu div{padding:6px 14px;cursor:pointer}.fundo{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}.caixa{background:#fff;padding:24px;border-radius:8px}</style><title>Nova proposta</title></head><body>
<h1>Nova proposta de crédito</h1>
<form id="f" onsubmit="event.preventDefault(); window.estado.enviado = true;">
<label>CNPJ do cliente <input name="cnpj"></label>
<label>Nome do contato <input name="contato"></label>
<label>Limite aprovado (R$) <input name="limite"></label>
<button type="submit">Enviar proposta</button>
</form>
<script>window.estado = { enviado: false };
window.valores = () => Object.fromEntries(new FormData(document.getElementById('f')));</script>
</body></html>

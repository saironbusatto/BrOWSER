<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:15px system-ui;margin:24px;max-width:900px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}button{padding:6px 12px;cursor:pointer}label{display:block;margin:10px 0}input,select{padding:5px;min-width:260px}nav a{margin-right:12px}.cartao{display:inline-block;border:2px solid #999;border-radius:8px;padding:16px 24px;margin:8px;cursor:pointer}.cartao.sel{border-color:#0a0;background:#efe}.menu{border:1px solid #999;padding:4px;display:inline-block}.menu div{padding:6px 14px;cursor:pointer}.fundo{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}.caixa{background:#fff;padding:24px;border-radius:8px}</style><title>Projetos</title></head><body>
<h1>Projetos</h1>
<div id="lista"></div>
<script>
window.estado = { arquivados: [], exportados: [], duplicados: [] };
const lista = document.getElementById('lista');
for (const nome of ['Boreal', 'Atlas', 'Cometa']) {
  const linha = document.createElement('p');
  linha.innerHTML = '<strong>Projeto ' + nome + '</strong> <button aria-label="Mais opções do projeto ' + nome + '" aria-haspopup="menu">⋮</button>';
  linha.querySelector('button').onclick = () => {
    document.querySelector('.menu')?.remove();
    const m = document.createElement('div');
    m.className = 'menu'; m.setAttribute('role', 'menu');
    for (const [rotulo, chave] of [['Exportar', 'exportados'], ['Duplicar', 'duplicados'], ['Arquivar', 'arquivados']]) {
      const i = document.createElement('div');
      i.setAttribute('role', 'menuitem'); i.tabIndex = 0; i.textContent = rotulo;
      i.onclick = () => {
        m.remove();
        if (chave !== 'arquivados') return estado[chave].push(nome);
        const f = document.createElement('div');
        f.className = 'fundo';
        f.innerHTML = '<div class="caixa" role="dialog" aria-label="Confirmar"><p>Arquivar o projeto ' + nome + '? Ele some da lista.</p><button>Cancelar</button> <button>Arquivar projeto</button></div>';
        const [nao, sim] = f.querySelectorAll('button');
        nao.onclick = () => f.remove();
        sim.onclick = () => { estado.arquivados.push(nome); f.remove(); linha.remove(); };
        document.body.append(f);
      };
      m.append(i);
    }
    linha.append(m);
  };
  lista.append(linha);
}
</script></body></html>

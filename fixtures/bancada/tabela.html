<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{font:15px system-ui;margin:24px;max-width:900px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:6px 10px;text-align:left}button{padding:6px 12px;cursor:pointer}label{display:block;margin:10px 0}input,select{padding:5px;min-width:260px}nav a{margin-right:12px}.cartao{display:inline-block;border:2px solid #999;border-radius:8px;padding:16px 24px;margin:8px;cursor:pointer}.cartao.sel{border-color:#0a0;background:#efe}.menu{border:1px solid #999;padding:4px;display:inline-block}.menu div{padding:6px 14px;cursor:pointer}.fundo{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center}.caixa{background:#fff;padding:24px;border-radius:8px}</style><title>Notas fiscais</title></head><body>
<h1>Notas fiscais emitidas</h1>
<table><thead><tr><th>Número</th><th>Cliente</th><th>Emissão</th><th>Valor</th><th>Ações</th></tr></thead><tbody id="t"></tbody></table>
<script>
const notas = [[1041,'Mercado Bom Preço','02/09/2026','R$ 1.250,00'],[1042,'Oficina Dois Irmãos','03/09/2026','R$ 480,00'],[1043,'Padaria Sol','03/09/2026','R$ 219,90'],[1044,'Clínica Vida','05/09/2026','R$ 3.100,00'],[1045,'Padaria Lua','08/09/2026','R$ 219,90'],[1046,'Escola Saber','09/09/2026','R$ 940,00']];
window.estado = { excluidas: [], editadas: [] };
const t = document.getElementById('t');
for (const [n, c, d, v] of notas) {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td>' + n + '</td><td>' + c + '</td><td>' + d + '</td><td>' + v + '</td><td><button>Editar</button> <button>Excluir</button></td>';
  const [ed, ex] = tr.querySelectorAll('button');
  ed.onclick = () => estado.editadas.push(n);
  ex.onclick = () => { estado.excluidas.push(n); tr.remove(); };
  t.append(tr);
}
</script></body></html>

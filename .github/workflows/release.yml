name: Release

# git tag v0.1.0 && git push origin v0.1.0  →  pré-release com os pacotes para download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read # o action da SignPath lê o artefato do workflow e baixa o binário assinado

jobs:
  # O .exe é compilado aqui, no Windows, e não no Ubuntu: o rcedit é um executável Windows e
  # não roda no Linux sem wine. Compilando nativamente o pacote também sai sem cross-compilation.
  preparar-windows:
    runs-on: windows-latest
    outputs:
      # O action da SignPath não lê o artefato do checkout: ele exige o id que o
      # upload-artifact devolve, então o id precisa atravessar o job.
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Versão da tag = versão da extensão
        run: |
          $env:VERSAO = "${{ github.ref_name }}".TrimStart('v')
          $ext = (Get-Content packages/extension/package.json | ConvertFrom-Json).version
          if ($env:VERSAO -ne $ext) { throw "tag $env:VERSAO ≠ extensão $ext" }
          "VERSAO=$($env:VERSAO)" | Out-File -FilePath $env:GITHUB_ENV -Append
          # O Windows quer 4 partes numéricas em FileVersion/ProductVersion.
          $p = $env:VERSAO.Split('.')
          "VERSAO_WIN=$($p[0]).$($p[1]).$($p[2]).0" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compilar a ponte para Windows
        run: bun run --cwd packages/bridge build:win

      # Requisito do SignPath: todo binário assinado precisa ter ProductName e ProductVersion
      # preenchidos e iguais em cada build. O bun build --compile não escreve esse recurso, e
      # o rcedit que grava é um executável Windows — por isso este job é windows-latest.
      - name: Metadata PE + ícone
        run: bun scripts/rceditar.ts packages/bridge/dist/bridge.exe $env:VERSAO_WIN

      # Falha aqui, com nome, em vez de a SignPath recusar o artefato depois.
      - name: Conferir que o recurso entrou
        run: |
          if (-not (Select-String -Path packages/bridge/dist/bridge.exe -Pattern "bRowser" -SimpleMatch -Quiet)) {
            throw "metadata PE nao entrou no binario"
          }
          (Get-Item packages/bridge/dist/bridge.exe).VersionInfo |
            Format-List ProductName, ProductVersion, FileVersion

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: bridge-win-${{ github.ref_name }}
          path: packages/bridge/dist/bridge.exe
          archive: false # ja e um .exe; zip aqui quebraria a config de artefato do SignPath
          retention-days: 7

  release:
    needs: preparar-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Versão da tag = versão da extensão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          EXT=$(bun -e 'console.log(require("./packages/extension/package.json").version)')
          [ "$VERSAO" = "$EXT" ] || { echo "tag $VERSAO ≠ extensão $EXT"; exit 1; }
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Compilar extensão e ponte Linux
        # O client_id do Google (conector do Drive) é público por definição — o segredo real é o
        # refresh token, que fica no keyring do navegador. Por isso é var, não secret. Sem ele a
        # extensão ainda compila: utils/conectores.ts só mostra "Em breve" no lugar do botão.
        env:
          BROWSER_GOOGLE_CLIENT_ID: ${{ vars.BROWSER_GOOGLE_CLIENT_ID }}
        run: |
          bun packages/bridge/scripts/check-control.ts release
          bun run --cwd packages/extension build
          bun run --cwd packages/bridge build
          head -c4 packages/bridge/dist/bridge | grep -q $'\x7fELF' || { echo 'bridge não é um ELF'; exit 1; }
          test -x packages/bridge/dist/bridge || { echo 'bridge sem permissão de execução'; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: bridge-win-${{ github.ref_name }}
          path: pacotes/windows

      # Condicional de propósito: hoje o certificado não existe e o release precisa sair
      # mesmo. Quando o pedido for aprovado, gravar SIGNPATH_ORG_ID e SIGNPATH_PROJECT_SLUG
      # como variáveis e a SIGNPATH_API_TOKEN como segredo.
      - name: Assinar com SignPath
        id: assinar
        # O guarda é uma variável do repositório, não o segredo: o GitHub não compila um
        # workflow que cita `secrets.X` dentro de `if:` enquanto esse segredo não existe
        # no repositório — e é justamente o caso de hoje, em que o certificado ainda não
        # foi aprovado e o release precisa sair do mesmo jeito. Com a variável setada, o
        # passo roda e usa o segredo, que aí precisa existir.
        if: ${{ vars.SIGNPATH_ORG_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.preparar-windows.outputs.artifact-id }}
          wait-for-completion: true
          skip-decompress: true # bate com archive:false no job de cima
          output-artifact-directory: ${{ github.workspace }}/assinados

      - name: Empacotar
        run: |
          set -e
          mkdir -p pacotes/windows pacotes/linux
          cp -r packages/extension/.output/chrome-mv3 pacotes/windows/extensao
          cp -r packages/extension/.output/chrome-mv3 pacotes/linux/extensao
          # O SignPath pode devolver o arquivo com outro nome (a config de artefato define isso),
          # então procuramos qualquer .exe em vez de cravar o nome.
          ASSINADO=$(find assinados -name '*.exe' -type f 2>/dev/null | head -1)
          if [ -n "$ASSINADO" ]; then
            cp "$ASSINADO" pacotes/windows/bridge.exe
            echo "usando o binario assinado: $ASSINADO"
          else
            echo "sem assinatura (falta SIGNPATH_API_TOKEN); publicando o binario do CI"
          fi
          cp packages/bridge/scripts/uninstall.ps1 packages/bridge/scripts/instalar.cmd design/icone.ico LICENSE pacotes/windows/
          cp packages/bridge/dist/bridge packages/bridge/scripts/install.sh packages/bridge/scripts/leia-me.md LICENSE pacotes/linux/
          chmod +x pacotes/windows/bridge.exe pacotes/linux/bridge pacotes/linux/install.sh
          sed "s/\[string\]\$Versao = '[^']*'/[string]\$Versao = '$VERSAO'/" packages/bridge/scripts/setup.ps1 > pacotes/windows/setup.ps1
          grep -q "\\\$Versao = '$VERSAO'" pacotes/windows/setup.ps1 || { echo 'a versão não entrou no setup.ps1'; exit 1; }
          sed "s/^VERSAO=\".*\"$/VERSAO=\"$VERSAO\"/" pacotes/linux/install.sh > /tmp/install.sh && mv /tmp/install.sh pacotes/linux/install.sh
          grep -q "^VERSAO=\"$VERSAO\"" pacotes/linux/install.sh || { echo 'a versão não entrou no install.sh'; exit 1; }
          chmod +x pacotes/linux/install.sh
          (cd pacotes/windows && zip -q -r ../BrOWSER-windows.zip .)
          (cd pacotes/linux && tar -czf ../BrOWSER-linux.tar.gz .)
          (cd packages/extension/.output/chrome-mv3 && zip -q -r "$GITHUB_WORKSPACE/pacotes/BrOWSER-extensao.zip" .)
          # Confere que os três pacotes saíram com conteúdo, e não um zip vazio.
          for p in pacotes/BrOWSER-windows.zip pacotes/BrOWSER-extensao.zip pacotes/BrOWSER-linux.tar.gz; do
            test -s "$p" || { echo "pacote vazio: $p"; exit 1; }
          done
          # A extensão tem que estar dentro: é o que faz o release ser um download só.
          for f in pacotes/windows/extensao/manifest.json pacotes/linux/extensao/manifest.json \
                   pacotes/windows/setup.ps1 pacotes/windows/instalar.cmd \
                   pacotes/linux/install.sh; do
            test -f "$f" || { echo "faltando no pacote: $f"; exit 1; }
          done
          # O .cmd e o que a pessoa clica. Sem ele, o pacote Windows tem so um .ps1, e o duplo
          # clique nele ou abre no Bloco de Notas ou e barrado pela ExecutionPolicy.
          grep -q 'setup.ps1' pacotes/windows/instalar.cmd || { echo 'instalar.cmd nao chama o setup.ps1'; exit 1; }
          ls -la pacotes

      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --title "BrOWSER $VERSAO" \
            pacotes/BrOWSER-windows.zip pacotes/BrOWSER-extensao.zip pacotes/BrOWSER-linux.tar.gz

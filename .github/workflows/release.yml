name: Release

# git tag v0.1.0 && git push origin v0.1.0  →  pré-release com os pacotes para download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Versão da tag = versão da extensão
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          EXT=$(bun -e 'console.log(require("./packages/extension/package.json").version)')
          [ "$VERSAO" = "$EXT" ] || { echo "tag $VERSAO ≠ extensão $EXT"; exit 1; }
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"

      - name: Compilar a extensão
        run: bun run --cwd packages/extension build

      # O release roda em Linux e produz o executável do Windows na cross-compilação. Cada artefato
      # é verificado por comportamento e por tipo antes de empacotar: um release que subisse com o
      # binário errado (ou com o /control aberto) só apareceria depois de todo o resto passar.
      # check-control também deixa o binário de release já compilado.
      - name: Verificar os dois artefatos da ponte
        run: |
          bun packages/bridge/scripts/check-control.ts release
          bun run --cwd packages/bridge build:win
          # MZ no começo = Portable Executable. Um ELF aqui significaria que o build "de Windows"
          # saiu Linux, que é exatamente o que acontecia quando o nome vinha da plataforma do host.
          head -c2 packages/bridge/dist/bridge.exe | grep -q 'MZ' || { echo 'bridge.exe não é um PE'; exit 1; }
          head -c4 packages/bridge/dist/bridge | grep -q $'\x7fELF' || { echo 'bridge não é um ELF'; exit 1; }
          test -x packages/bridge/dist/bridge || { echo 'bridge sem permissão de execução'; exit 1; }
          ls -la packages/bridge/dist/

      - name: Empacotar
        run: |
          set -e
          mkdir -p pacotes/windows pacotes/linux
          # A extensão vai DENTRO de cada pacote: uma máquina virgem não deveria precisar baixar
          # dois arquivos e descobrir qual é o quê. O zip solto continua existindo, para quem só
          # quer atualizar a extensão.
          cp -r packages/extension/.output/chrome-mv3 pacotes/windows/extensao
          cp -r packages/extension/.output/chrome-mv3 pacotes/linux/extensao
          cp packages/bridge/dist/bridge.exe packages/bridge/scripts/uninstall.ps1 packages/bridge/scripts/instalar.cmd design/icone.ico LICENSE pacotes/windows/
          cp packages/bridge/dist/bridge packages/bridge/scripts/install.sh packages/bridge/scripts/leia-me.md LICENSE pacotes/linux/
          chmod +x pacotes/windows/bridge.exe pacotes/linux/bridge pacotes/linux/install.sh
          # O instalador leva a versão do release.
          sed "s/\[string\]\$Versao = '[^']*'/[string]\$Versao = '$VERSAO'/" packages/bridge/scripts/setup.ps1 > pacotes/windows/setup.ps1
          grep -q "\\\$Versao = '$VERSAO'" pacotes/windows/setup.ps1 || { echo 'a versão não entrou no setup.ps1'; exit 1; }
          sed "s/^VERSAO=\".*\"$/VERSAO=\"$VERSAO\"/" pacotes/linux/install.sh > /tmp/install.sh && mv /tmp/install.sh pacotes/linux/install.sh
          grep -q "^VERSAO=\"$VERSAO\"" pacotes/linux/install.sh || { echo 'a versão não entrou no install.sh'; exit 1; }
          chmod +x pacotes/linux/install.sh
          (cd pacotes/windows && zip -q -r ../BrOWSER-windows.zip .)
          (cd pacotes/linux && tar -czf ../BrOWSER-linux.tar.gz .)
          (cd packages/extension/.output/chrome-mv3 && zip -q -r "$GITHUB_WORKSPACE/pacotes/BrOWSER-extensao.zip" .)
          # Confere que os três pacotes saíram com conteúdo, e não um zip vazio.
          for p in pacotes/BrOWSER-windows.zip pacotes/BrOWSER-extensao.zip pacotes/BrOWSER-linux.tar.gz; do
            test -s "$p" || { echo "pacote vazio: $p"; exit 1; }
          done
          # A extensão tem que estar dentro: é o que faz o release ser um download só.
          for f in pacotes/windows/extensao/manifest.json pacotes/linux/extensao/manifest.json \
                   pacotes/windows/setup.ps1 pacotes/windows/instalar.cmd \
                   pacotes/linux/install.sh; do
            test -f "$f" || { echo "faltando no pacote: $f"; exit 1; }
          done
          # O .cmd e o que a pessoa clica. Sem ele, o pacote Windows tem so um .ps1, e o duplo
          # clique nele ou abre no Bloco de Notas ou e barrado pela ExecutionPolicy.
          grep -q 'setup.ps1' pacotes/windows/instalar.cmd || { echo 'instalar.cmd nao chama o setup.ps1'; exit 1; }
          ls -la pacotes

      - name: Publicar pré-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes --title "BrOWSER $VERSAO" \
            pacotes/BrOWSER-windows.zip pacotes/BrOWSER-extensao.zip pacotes/BrOWSER-linux.tar.gz

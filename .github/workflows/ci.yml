name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ponte-e-extensao:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=text
      - run: bun run --cwd packages/extension build

      # O CI precisa do /control (o smoke e o spike usam); o release não (ver packages/bridge/src/build.ts).
      - name: Compilar a ponte (dev)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bun run --cwd packages/bridge build:win:dev; else bun run --cwd packages/bridge build:dev; fi

      # Prova comportamental, não grep: o binário de release precisa responder 404 em /control mesmo
      # com BROWSE_DEV=1 no ambiente (foi esse o furo: um fallback de env religava a rota).
      - name: /control só existe no build de dev
        shell: bash
        run: |
          bun run --cwd packages/bridge build
          EXE=packages/bridge/dist/bridge; [ "$RUNNER_OS" = "Windows" ] && EXE=packages/bridge/dist/bridge.exe
          bun packages/bridge/scripts/check-control.ts "$EXE" release
          bun run --cwd packages/bridge build:dev
          bun packages/bridge/scripts/check-control.ts "$EXE" dev

      # Sem login: só confere que o codex (shim .cmd no Windows) é iniciável pela ponte.
      - name: Instalar codex
        run: npm install -g @openai/codex

      - name: Registrar a ponte (bridge --install)
        if: runner.os == 'Linux'
        run: packages/bridge/dist/bridge --install

      # No Windows, testa o instalador do usuário final (copia para %LOCALAPPDATA% e registra).
      - name: Instalador (setup.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packages/bridge/scripts/setup.ps1, packages/bridge/scripts/uninstall.ps1, design/icone.ico packages/bridge/dist/
          & packages/bridge/dist/setup.ps1 -Sim -SemIA
          if (-not (Test-Path "$env:LOCALAPPDATA\BrOWSER\bridge.exe")) { throw 'bridge.exe não foi copiado' }
          $app = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER'
          if ($app.DisplayName -ne 'BrOWSER') { throw 'entrada em Aplicativos instalados ausente' }
          $app | Select-Object DisplayName, DisplayVersion, UninstallString, EstimatedSize | Format-List

      - name: Conferir registro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($chave in 'Google\Chrome', 'BraveSoftware\Brave-Browser', 'Microsoft\Edge') {
            $manifesto = (Get-ItemProperty "HKCU:\Software\$chave\NativeMessagingHosts\com.browser.bridge").'(default)'
            if (-not (Test-Path $manifesto)) { throw "manifesto não encontrado para ${chave}: $manifesto" }
          }
          Get-Content $manifesto

      - name: Conferir registro (Linux)
        if: runner.os == 'Linux'
        run: cat ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - name: Ponte ↔ extensão falsa (sem IA)
        shell: bash
        run: |
          EXE=packages/bridge/dist/bridge; [ "$RUNNER_OS" = "Windows" ] && EXE=packages/bridge/dist/bridge.exe
          bun packages/bridge/scripts/smoke.ts "$EXE" --codex

      # Desinstalação tem de desfazer tudo (exigência da SignPath: "uninstallation facilities").
      - name: Desinstalador (uninstall.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\BrOWSER\uninstall.ps1" -Sim
          if (Test-Path "$env:LOCALAPPDATA\BrOWSER") { throw 'pasta do BrOWSER não foi removida' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER') { throw 'entrada em Aplicativos instalados não foi removida' }
          foreach ($chave in 'Google\Chrome', 'BraveSoftware\Brave-Browser', 'Microsoft\Edge') {
            if (Test-Path "HKCU:\Software\$chave\NativeMessagingHosts\com.browser.bridge") { throw "registro não removido: $chave" }
          }
          'desinstalação completa'

      - name: Desinstalação (Linux)
        if: runner.os == 'Linux'
        run: |
          packages/bridge/dist/bridge --uninstall
          test ! -e ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ matrix.os }}
          path: packages/bridge/dist/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ponte-e-extensao:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=text
      - run: bun run --cwd packages/extension build
      - run: bun run --cwd packages/bridge build
      - run: bun run --cwd packages/bridge build:win

      # O CI precisa do /control (o smoke e o spike usam); o release não (ver packages/bridge/src/build.ts).
      - name: Compilar a ponte (dev)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bun run --cwd packages/bridge build:win:dev; else bun run --cwd packages/bridge build:dev; fi

      # O /control (rota de teste) só pode existir no build de dev. O script compila para a
      # plataforma deste runner e prova por comportamento: release responde 404, dev responde.
      # BROWSE_DEV=1 no ambiente é o teste — se houvesse fallback de runtime, o release voltaria.
      # Deixa o build de dev no lugar, que é o que o smoke usa.
      - name: /control só existe no build de dev
        shell: bash
        run: |
          bun packages/bridge/scripts/check-control.ts release
          bun packages/bridge/scripts/check-control.ts dev

      # Sem login: só confere que o codex (shim .cmd no Windows) é iniciável pela ponte.
      - name: Instalar codex
        run: npm install -g @openai/codex

      - name: Registrar a ponte (bridge --install)
        if: runner.os == 'Linux'
        run: packages/bridge/dist/bridge --install

      # No Windows, testa o instalador do usuário final (copia para %LOCALAPPDATA% e registra).
      - name: Instalador (setup.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item packages/bridge/scripts/setup.ps1, packages/bridge/scripts/uninstall.ps1, design/icone.ico packages/bridge/dist/
          & packages/bridge/dist/setup.ps1 -Sim -SemIA
          if (-not (Test-Path "$env:LOCALAPPDATA\BrOWSER\bridge.exe")) { throw 'bridge.exe não foi copiado' }
          $app = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER'
          if ($app.DisplayName -ne 'BrOWSER') { throw 'entrada em Aplicativos instalados ausente' }
          $app | Select-Object DisplayName, DisplayVersion, UninstallString, EstimatedSize | Format-List

      - name: Conferir registro (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($chave in 'Google\Chrome', 'BraveSoftware\Brave-Browser', 'Microsoft\Edge') {
            $manifesto = (Get-ItemProperty "HKCU:\Software\$chave\NativeMessagingHosts\com.browser.bridge").'(default)'
            if (-not (Test-Path $manifesto)) { throw "manifesto não encontrado para ${chave}: $manifesto" }
          }
          Get-Content $manifesto

      # Instalador do Linux, caminho completo em HOME de mentira. Um release que ninguém instalou
      # em máquina limpa é um release que ninguém sabe se funciona.
      - name: Instalador (install.sh) e diagnóstico
        if: runner.os == 'Linux'
        run: |
          set -e
          rm -rf /tmp/pacote && mkdir -p /tmp/pacote/extensao
          cp packages/bridge/dist/bridge /tmp/pacote/bridge
          cp -r packages/extension/.output/chrome-mv3/. /tmp/pacote/extensao/
          cp packages/bridge/scripts/install.sh packages/bridge/scripts/leia-me.md /tmp/pacote/
          chmod +x /tmp/pacote/bridge /tmp/pacote/install.sh

          export HOME=/tmp/home-instalador
          rm -rf "$HOME" && mkdir -p "$HOME"

          # Antes de instalar, o diagnóstico aponta o que falta. Aqui tem navegador e falta a ponte.
          /tmp/pacote/bridge --doctor || true

          /tmp/pacote/install.sh --sim
          test -x "$HOME/.local/share/BrOWSER/bridge" || { echo 'ponte não copiada'; exit 1; }
          test -f "$HOME/.local/share/BrOWSER/extensao/manifest.json" || { echo 'extensão não copiada'; exit 1; }
          test -x "$HOME/.local/share/BrOWSER/install.sh" || { echo 'instalador não copiado: sem como desinstalar'; exit 1; }
          cat "$HOME/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json"

          # Depois de instalar, o diagnóstico tem que relatar a ponte registrada no Chrome.
          # Não pode exigir saída 0: no CI o codex está instalado mas sem login (o passo acima só
          # instala), e o doctor saía com 1 de propósito — a pessoa ainda tem o que fazer.
          "$HOME/.local/share/BrOWSER/bridge" --doctor | tee /tmp/doctor.txt || true
          grep -q 'Chrome: ponte registrada' /tmp/doctor.txt || { echo 'doctor não viu a ponte registrada'; cat /tmp/doctor.txt; exit 1; }

          # E a desinstalação tem de desfazer tudo (exigência da SignPath).
          "$HOME/.local/share/BrOWSER/install.sh" --sim --desinstalar
          test ! -e "$HOME/.local/share/BrOWSER" || { echo 'pasta do BrOWSER não foi removida'; exit 1; }
          test ! -e "$HOME/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json" || { echo 'registro não removido'; exit 1; }
          test ! -e "$HOME/.config/browser-bridge" || { echo 'dados locais não removidos'; exit 1; }
          echo 'instalação e desinstalação completas'

      - name: Conferir registro (Linux)
        if: runner.os == 'Linux'
        run: cat ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - name: Ponte ↔ extensão falsa (sem IA)
        shell: bash
        run: |
          EXE=packages/bridge/dist/bridge; [ "$RUNNER_OS" = "Windows" ] && EXE=packages/bridge/dist/bridge.exe
          bun packages/bridge/scripts/smoke.ts "$EXE" --codex

      # Desinstalação tem de desfazer tudo (exigência da SignPath: "uninstallation facilities").
      - name: Desinstalador (uninstall.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:LOCALAPPDATA\BrOWSER\uninstall.ps1" -Sim
          if (Test-Path "$env:LOCALAPPDATA\BrOWSER") { throw 'pasta do BrOWSER não foi removida' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER') { throw 'entrada em Aplicativos instalados não foi removida' }
          foreach ($chave in 'Google\Chrome', 'BraveSoftware\Brave-Browser', 'Microsoft\Edge') {
            if (Test-Path "HKCU:\Software\$chave\NativeMessagingHosts\com.browser.bridge") { throw "registro não removido: $chave" }
          }
          'desinstalação completa'

      - name: Desinstalação (Linux)
        if: runner.os == 'Linux'
        run: |
          packages/bridge/dist/bridge --uninstall
          test ! -e ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ matrix.os }}
          path: packages/bridge/dist/

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ponte-e-extensao:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test --coverage --coverage-reporter=text
      - run: bun run --cwd packages/extension build
      - run: bun run --cwd packages/bridge build
      - run: bun run --cwd packages/bridge build:win

      # O CI precisa do /control (o smoke e o spike usam); o release não (ver packages/bridge/src/build.ts).
      - name: Compilar a ponte (dev)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then bun run --cwd packages/bridge build:win:dev; else bun run --cwd packages/bridge build:dev; fi

      # O /control (rota de teste) só pode existir no build de dev. O script compila para a
      # plataforma deste runner e prova por comportamento: release responde 404, dev responde.
      # BROWSE_DEV=1 no ambiente é o teste — se houvesse fallback de runtime, o release voltaria.
      # Deixa o build de dev no lugar, que é o que o smoke usa.
      - name: /control só existe no build de dev
        shell: bash
        run: |
          bun packages/bridge/scripts/check-control.ts release
          bun packages/bridge/scripts/check-control.ts dev

      # Sem login: só confere que o codex (shim .cmd no Windows) é iniciável pela ponte.
      - name: Instalar codex
        run: npm install -g @openai/codex

      - name: Registrar a ponte (bridge --install)
        if: runner.os == 'Linux'
        run: packages/bridge/dist/bridge --install

      # No Windows, o instalador é um .exe de verdade, e o CI o executa. Um instalador que só
      # compila não diz nada: o que quebra é o registro, o caminho da extensão, o atalho e a
      # desinstalação — e cada um desses só falha rodando.
      - name: Compilar o instalador (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # O PATH NÃO é caminho para o makensis: o choco instala em C:\Program Files (x86)\NSIS
          # e a sessão do PowerShell já em execução continua sem enxergar o diretório novo. A
          # primeira versão deste passo falhou exatamente nisso, com "makensis is not recognized"
          # logo depois de o choco ter reportado sucesso.
          $makensis = (Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue |
                       Select-Object -First 1).FullName
          if (-not $makensis) {
            'makensis não encontrado; instalando com o choco' | Out-Host
            choco install nsis --no-progress -y
            $makensis = (Get-ChildItem 'C:\Program Files*\NSIS\makensis.exe' -ErrorAction SilentlyContinue |
                         Select-Object -First 1).FullName
          }
          if (-not $makensis) { throw 'makensis continua ausente depois do choco install nsis' }
          "makensis: $makensis"
          & $makensis -VERSION
          New-Item -ItemType Directory -Force -Path dist-instalador/extensao | Out-Null
          Copy-Item packages/bridge/dist/bridge.exe, design/icone.ico dist-instalador/
          Copy-Item packages/extension/.output/chrome-mv3/* dist-instalador/extensao/ -Recurse
          Copy-Item packages/bridge/scripts/instalar.nsi, packages/bridge/scripts/instalar-versao.nsh dist-instalador/
          Push-Location dist-instalador
          # A versão vai por arquivo, não por -D: no Windows o makensis reparte o argumento com
          # ponto e sobraria um pedaço como nome de script. O idioma é PortugueseBR nas duas
          # plataformas (BrazilianPortuguese é nome do Inno Setup e não existe no NSIS).
          $defs = @('!define VERSAO "0.0.0"')
          Set-Content -Encoding ASCII -Path instalar-versao.nsh -Value $defs
          Get-Content instalar-versao.nsh
          # Se o arquivo de idioma não existir, o makensis aborta com um erro que não diz quais
          # nomes ele aceita. Conferir antes e dizer a lista no log evita a caça ao tesouro.
          $nlf = Get-ChildItem (Split-Path $makensis) -Recurse -Filter 'PortugueseBR.nlf' -ErrorAction SilentlyContinue
          if (-not $nlf) {
            'PortugueseBR.nlf não encontrado. Idiomas disponíveis:' | Out-Host
            Get-ChildItem (Join-Path (Split-Path $makensis) 'Contrib') -Recurse -Filter '*.nlf' -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty Name | Out-Host
            throw 'o instalador não pode ser compilado sem o arquivo de idioma'
          }
          "idioma: $($nlf.FullName)"
          & $makensis instalar.nsi
          Pop-Location
          if (-not (Test-Path dist-instalador/BrOWSER-Setup-0.0.0.exe)) { throw 'o instalador não foi gerado' }
          $cabecalho = (Get-Content dist-instalador/BrOWSER-Setup-0.0.0.exe -AsByteStream -TotalCount 2) -join ','
          if ($cabecalho -ne '77,90') { throw "o instalador não é um PE (cabeçalho: $cabecalho)" }

      - name: Instalar (o .exe, em silêncio, como quem clica)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist-instalador/BrOWSER-Setup-0.0.0.exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o instalador saiu com $($p.ExitCode)" }
          if (-not (Test-Path "$env:LOCALAPPDATA\BrOWSER\bridge.exe")) { throw 'bridge.exe não foi instalado' }
          if (-not (Test-Path "$env:LOCALAPPDATA\BrOWSER\extensao\manifest.json")) { throw 'a extensão não foi instalada' }
          if (-not (Test-Path "$env:LOCALAPPDATA\BrOWSER\Uninstall BrOWSER.exe")) { throw 'o desinstalador não foi criado' }
          $app = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER'
          $app | Select-Object DisplayName, DisplayVersion, InstallLocation, UninstallString, EstimatedSize | Format-List
          if ($app.DisplayName -ne 'BrOWSER') { throw 'entrada em Aplicativos instalados ausente' }
          if ($app.UninstallString -notmatch 'Uninstall BrOWSER.exe') { throw 'o desinstalador registrado não é o do instalador' }

          # O --doctor é executado aqui, e o ponto do teste é que ele TERMINA. No Windows toda CLI
          # de npm é um shim .cmd: o cmd.exe vira um processo neto que segura a saída padrão, e a
          # leitura do status ficava esperando para sempre. Foi esse passo que travou a primeira
          # versão do instalador no runner.
          #
          # Não dá para exigir saída 0: o codex do CI está instalado e sem login, e aí o doctor
          # está certo em reclamar. O que não pode é não voltar.
          # WaitForExit(ms) e não Wait-Process -Timeout: o segundo devolve $null mesmo quando o
          # processo já terminou, então a verificação passaria a reprovar sempre. O primeiro
          # devolve $true/$false de verdade, o que é o que o teste precisa saber.
          $doctor = Start-Process "$env:LOCALAPPDATA\BrOWSER\bridge.exe" -ArgumentList '--doctor' -NoNewWindow -PassThru
          if (-not $doctor.WaitForExit(90000)) {
            $doctor | Stop-Process -Force
            throw 'o --doctor não voltou em 90s: uma CLI de IA travou o diagnóstico'
          }
          "o --doctor voltou com código $($doctor.ExitCode) (1 é o esperado aqui: codex sem login)"

          # O arquivo que o instalador escreve é a prova de que os acentos sobreviveram à página de
          # código do Windows até o arquivo em disco. Acentuação perdida aqui é defeito visível na
          # tela da pessoa, e nenhuma asserção de "o instalador rodou" pegaria isso.
          $txt = Get-Content "$env:LOCALAPPDATA\BrOWSER\INSTALADO.txt" -Raw -Encoding UTF8
          if ($txt -notmatch 'Diagnóstico') { throw "acentuação perdida no INSTALADO.txt: $txt" }
          if ($txt -notmatch 'extensão') { throw "acentuação perdida no INSTALADO.txt: $txt" }
          $txt

      # Instalador do Linux, caminho completo em HOME de mentira. Um release que ninguém instalou
      # em máquina limpa é um release que ninguém sabe se funciona.
      - name: Instalador (install.sh) e diagnóstico
        if: runner.os == 'Linux'
        run: |
          set -e
          rm -rf /tmp/pacote && mkdir -p /tmp/pacote/extensao
          cp packages/bridge/dist/bridge /tmp/pacote/bridge
          cp -r packages/extension/.output/chrome-mv3/. /tmp/pacote/extensao/
          cp packages/bridge/scripts/install.sh packages/bridge/scripts/leia-me.md /tmp/pacote/
          chmod +x /tmp/pacote/bridge /tmp/pacote/install.sh

          export HOME=/tmp/home-instalador
          rm -rf "$HOME" && mkdir -p "$HOME"

          # Antes de instalar, o diagnóstico aponta o que falta. Aqui tem navegador e falta a ponte.
          /tmp/pacote/bridge --doctor || true

          /tmp/pacote/install.sh --sim
          test -x "$HOME/.local/share/BrOWSER/bridge" || { echo 'ponte não copiada'; exit 1; }
          test -f "$HOME/.local/share/BrOWSER/extensao/manifest.json" || { echo 'extensão não copiada'; exit 1; }
          test -x "$HOME/.local/share/BrOWSER/install.sh" || { echo 'instalador não copiado: sem como desinstalar'; exit 1; }
          cat "$HOME/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json"

          # Depois de instalar, o diagnóstico tem que relatar a ponte registrada no Chrome.
          # Não pode exigir saída 0: no CI o codex está instalado mas sem login (o passo acima só
          # instala), e o doctor saía com 1 de propósito — a pessoa ainda tem o que fazer.
          "$HOME/.local/share/BrOWSER/bridge" --doctor | tee /tmp/doctor.txt || true
          grep -q 'Chrome: ponte registrada' /tmp/doctor.txt || { echo 'doctor não viu a ponte registrada'; cat /tmp/doctor.txt; exit 1; }

          # E a desinstalação tem de desfazer tudo (exigência da SignPath).
          "$HOME/.local/share/BrOWSER/install.sh" --sim --desinstalar
          test ! -e "$HOME/.local/share/BrOWSER" || { echo 'pasta do BrOWSER não foi removida'; exit 1; }
          test ! -e "$HOME/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json" || { echo 'registro não removido'; exit 1; }
          test ! -e "$HOME/.config/browser-bridge" || { echo 'dados locais não removidos'; exit 1; }
          echo 'instalação e desinstalação completas'

      - name: Conferir registro (Linux)
        if: runner.os == 'Linux'
        run: cat ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - name: Ponte ↔ extensão falsa (sem IA)
        shell: bash
        run: |
          EXE=packages/bridge/dist/bridge; [ "$RUNNER_OS" = "Windows" ] && EXE=packages/bridge/dist/bridge.exe
          bun packages/bridge/scripts/smoke.ts "$EXE" --codex

      # Desinstalação tem de desfazer tudo (exigência da SignPath: "uninstallation facilities").
      # A desinstalação tem de desfazer tudo, senão o BrOWSER não pode ser assinado: a SignPath
      # exige que exista uma forma de remover o que foi instalado. E o desinstalador gerado é um
      # .exe do próprio NSIS, então é ele que o CI executa.
      - name: Desinstalar (o desinstalador do instalador, em silêncio)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\BrOWSER\Uninstall BrOWSER.exe"
          if (-not (Test-Path $u)) { throw 'o desinstalador não existe' }
          $p = Start-Process $u -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "o desinstalador saiu com $($p.ExitCode)" }
          Start-Sleep -Seconds 2
          if (Test-Path "$env:LOCALAPPDATA\BrOWSER") { throw 'a pasta do BrOWSER não foi removida' }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BrOWSER') { throw 'a entrada em Aplicativos instalados não foi removida' }
          if (Test-Path 'HKCU:\Software\BrOWSER') { throw 'a chave de configuração ficou para trás' }
          foreach ($chave in 'Google\Chrome', 'BraveSoftware\Brave-Browser', 'Microsoft\Edge') {
            if (Test-Path "HKCU:\Software\$chave\NativeMessagingHosts\com.browser.bridge") { throw "registro não removido: $chave" }
          }
          'desinstalação completa'

      - name: Desinstalação (Linux)
        if: runner.os == 'Linux'
        run: |
          packages/bridge/dist/bridge --uninstall
          test ! -e ~/.config/google-chrome/NativeMessagingHosts/com.browser.bridge.json

      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ matrix.os }}
          path: packages/bridge/dist/
